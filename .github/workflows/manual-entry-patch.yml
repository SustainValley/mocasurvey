name: Apply manual participant entry flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-entry-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace ID image/OCR flow with direct entry
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          app_path = Path('src/App.jsx')
          text = app_path.read_text(encoding='utf-8')

          manual_block = r'''function ReviewField({ label, value, onChange, inputMode }) {
            return (
              <div className="review-field-wrap">
                <label>{label}</label>
                <div className="review-field is-editing">
                  <input
                    value={value}
                    placeholder={`${label}을 입력해주세요`}
                    inputMode={inputMode}
                    onChange={(e) => onChange(e.target.value)}
                  />
                </div>
              </div>
            );
          }

          function OcrReview({ initialData, onNext, busy = false, serverError = '' }) {
            const [data, setData] = useState(initialData || { name: '', studentId: '', department: '', rawText: '' });
            const update = (key) => (value) => setData((prev) => ({
              ...prev,
              [key]: key === 'studentId' ? value.replace(/[^0-9]/g, '') : value,
            }));
            const normalized = {
              ...data,
              name: (data.name || '').trim(),
              studentId: (data.studentId || '').trim(),
              department: (data.department || '').trim(),
            };
            const missing = !normalized.name || !normalized.studentId || !normalized.department;

            return (
              <Screen className="review-screen">
                <section className="review-head">
                  <h2>정보를 입력해주세요</h2>
                  <p>학번, 이름, 소속을 입력하면 바로 설문을 시작할 수 있어요.</p>
                </section>
                <div className="review-form">
                  <ReviewField label="학번" value={data.studentId || ''} onChange={update('studentId')} inputMode="numeric" />
                  <ReviewField label="이름" value={data.name || ''} onChange={update('name')} />
                  <ReviewField label="소속" value={data.department || ''} onChange={update('department')} />
                  <p className="unique-note">※ 학번 기준으로 온라인 설문은 한 번만 참여할 수 있어요.</p>
                  {serverError && <p className="ocr-error">{serverError}</p>}
                </div>
                <button className="review-cta" type="button" disabled={missing || busy} onClick={() => onNext(normalized)}>
                  {busy ? '참여 기록 확인 중...' : <>설문 시작하기&nbsp;&nbsp;→</>}
                </button>
                <Logo />
              </Screen>
            );
          }'''

          pattern = r"function ReviewField\([\s\S]*?\nfunction SurveyHeader\("
          replacement = manual_block + "\n\nfunction SurveyHeader("
          text, count = re.subn(pattern, lambda _: replacement, text, count=1)
          if count != 1:
            raise SystemExit(f'Could not replace review block; matches={count}')

          start_old = "{page === 'start' && <Start onNext={() => setPage('upload')} />}"
          start_new = "{page === 'start' && <Start onNext={() => setPage('review')} />}"
          if start_old not in text:
            raise SystemExit('Could not find start route')
          text = text.replace(start_old, start_new, 1)

          upload_old = "{page === 'upload' && <MobileId onSelected={handleSelected} isReading={isReading} progress={progress} error={ocrError} />}\n      {page === 'review' && <OcrReview initialData={ocrData} onBack={() => setPage('upload')} onNext={beginSurveyOrRestore} busy={isClaiming} serverError={serverError} />}"
          upload_new = "{(page === 'upload' || page === 'review') && <OcrReview initialData={ocrData} onNext={beginSurveyOrRestore} busy={isClaiming} serverError={serverError} />}"
          if upload_old not in text:
            raise SystemExit('Could not find upload/review routes')
          text = text.replace(upload_old, upload_new, 1)

          app_path.write_text(text, encoding='utf-8')

          css_path = Path('src/styles.css')
          css = css_path.read_text(encoding='utf-8')
          css_old = ".review-field input{position:absolute;left:15px;top:0;width:235px;"
          css_new = ".review-field input{position:absolute;left:15px;top:0;width:283px;"
          if css_old not in css:
            raise SystemExit('Could not find review input CSS')
          css = css.replace(css_old, css_new, 1)
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Commit final source changes and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/manual-entry-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/styles.css .github/workflows/manual-entry-patch.yml
          git commit -m "feat: replace ID image upload with direct participant entry"
          git push origin main
