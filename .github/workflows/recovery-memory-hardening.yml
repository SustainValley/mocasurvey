name: Apply survey recovery and memory hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recovery-memory-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply recovery and memory patch
        run: |
          python -m pip install --quiet pillow
          python .github/scripts/recovery_patch.py

      - name: Build verification
        run: |
          npm ci
          npm run build

      - name: Commit hardened client and remove one-off patch files
        run: |
          rm .github/workflows/recovery-memory-hardening.yml
          rm .github/scripts/recovery_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx public/step3-optimized .github/workflows/recovery-memory-hardening.yml .github/scripts/recovery_patch.py
          git commit -m "fix: resume survey after reload and reduce Step3 memory"
          git push origin main
